<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>HISABKITAB KOLORO MISTE</title>
<style>
:root{--bg:#fff;--cd:#fff;--tx:#111827;--mu:#6b7280;--ac:#1d4ed8;--bd:#e5e7eb;--er:#dc2626;--wa:#6b7280}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 0 150px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
h1{font-size:19px;line-height:1.15;letter-spacing:.5px;font-weight:800;color:var(--ac);margin:0}
#me{font-size:14px;color:var(--mu);text-align:right}#me a{color:var(--ac);font-weight:700;text-decoration:none}
main{padding:6px 14px;max-width:640px;margin:auto}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px}.g{display:grid;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mu{color:var(--mu)}
label{display:grid;gap:4px;font-size:14px;color:var(--mu)}
input,select{width:100%;min-height:48px;padding:0 12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:var(--tx);font:inherit;font-size:16px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}
button{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ac);color:#fff;font:inherit;font-size:16px;font-weight:700}
button.s{background:#fff;border:1px solid #d1d5db;color:var(--tx)}button.d{background:#fff;color:var(--er);border:1px solid #fca5a5}button.sm{min-height:40px;padding:0 12px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eef2f7;border-radius:12px;padding:4px;gap:4px}
.seg button{background:none;color:var(--mu);min-height:44px}.seg button.on{background:#fff;color:var(--ac);box-shadow:0 1px 3px #0003}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav{overflow-x:auto}nav button{flex:1 0 auto;min-width:78px;background:none;color:var(--mu);border-radius:0;min-height:58px;padding:0 12px;font-size:14px}nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
#bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--bd);padding:10px 14px;z-index:5;box-shadow:0 -2px 8px #0000000f}
#bar b{font-size:18px}
.b{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor}.pending{color:var(--wa)}.confirmed{color:var(--ac)}.cancelled{color:var(--er)}
.low{color:var(--er)}.w{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.w button{flex:1;min-width:90px}
.sp{display:flex;align-items:center;gap:6px}.sp input{width:64px;text-align:center;padding:0}.sp .st{min-width:46px;padding:0;background:#eef2f7;color:var(--tx);font-size:24px}
summary{font-weight:700;min-height:32px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<div id="splash" style="position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:24px;text-align:center">
  <div style="width:84px;height:84px;border-radius:22px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;box-shadow:0 6px 18px #1d4ed84a">HK</div>
  <div style="margin-top:18px;font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--ac);line-height:1.2">HISABKITAB<br>KOLORO MISTE</div>
  <div class="mu" style="margin-top:6px;font-size:14px">Orders &middot; Stock &middot; Sales</div>
</div>
<header style="display:none"><h1>HISABKITAB<br>KOLORO MISTE</h1><span id="me"></span></header>
<main id="m"></main><nav id="n"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyARf4TKwUjcVocACVTqcxIaPHOSidIttfk",authDomain:"plan-301.firebaseapp.com",projectId:"plan-301",storageBucket:"plan-301.firebasestorage.app",messagingSenderId:"87661579833",appId:"1:87661579833:web:86c0c42fced18bb2e887e8"};
const DOM='@dippradip.app',ADMIN='prabesh'+DOM;
firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.firestore();
function hideSplash(){const s=document.getElementById('splash');if(s&&!s._gone){s._gone=1;s.style.transition='opacity .25s';s.style.opacity='0';setTimeout(()=>s.remove(),250)}}
document.addEventListener('focusin',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'Rs '+(+n||0).toLocaleString();
let me=null,isAdmin=false,tab='new',prods=[],orders=[],staff=[],cart={},shop='',pq='',unsubs=[],mode='salesman',editId=null,disp=[],dImg='',dThumb='',dBill='',dNote='',dOrder='';
auth.onAuthStateChanged(async u=>{unsubs.forEach(f=>f());unsubs=[];me=u;
  if(!u){$('#n').innerHTML='';$('#me').innerHTML='';return login()}
  isAdmin=u.email===ADMIN;let name='Admin';
  if(!isAdmin){let d;try{d=await db.doc('staff/'+u.email.split('@')[0]).get()}catch(e){}
    if(!d||!d.exists){alert('This account is not approved. Ask the admin.');return auth.signOut()}name=d.data().name}
  me.dn=name;tab=isAdmin?'orders':'new';
  $('#me').innerHTML=esc(name)+' · <a href="#" onclick="auth.signOut();return false">Logout</a>';
  unsubs.push(db.collection('products').orderBy('name').onSnapshot(s=>{prods=s.docs.map(d=>({id:d.id,...d.data()}));draw()},er));
  const oq=isAdmin?db.collection('orders'):db.collection('orders').where('uid','==',u.uid);
  unsubs.push(oq.onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);draw()},er));
  unsubs.push((isAdmin?db.collection('dispatches'):db.collection('dispatches').where('uid','==',u.uid)).onSnapshot(s=>{disp=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);draw()},er));
  if(isAdmin)unsubs.push(db.collection('staff').onSnapshot(s=>{staff=s.docs.map(d=>({id:d.id,...d.data()}));draw()},er));
  draw()});
function er(e){console.error(e);alert('Error: '+e.message)}
function login(){document.querySelector('header').style.display='none';hideSplash();
  $('#m').innerHTML=`<div style="padding:8px 0 20px"><div class="c g"><div class="seg"><button class="${mode==='admin'?'on':''}" onclick="mode='admin';login()">Admin</button><button class="${mode==='salesman'?'on':''}" onclick="mode='salesman';login()">Salesman</button></div>${mode==='salesman'?'<input id="u" placeholder="Username" autocapitalize="none">':''}<input id="p" type="password" placeholder="Password"><button onclick="doLogin()">Login as ${mode}</button><small class="low" id="le"></small></div>`}
async function doLogin(){const u=mode==='admin'?'prabesh':$('#u').value.trim().toLowerCase(),p=$('#p').value;if(!u||!p)return;
  try{const c=await auth.signInWithEmailAndPassword(u+DOM,p);if(mode==='salesman'&&c.user.email===ADMIN){await auth.signOut();$('#le').textContent='Use the Admin login'}}catch(e){$('#le').textContent='Wrong username or password'}}
function draw(){if(!me)return;document.querySelector('header').style.display='';hideSplash();
  const t=isAdmin?[['orders','Orders'],['products','Stock'],['disp','Dispatch'],['staff','Salesmen'],['backup','Backup'],['new','New']]:[['new','New order'],['mine','My orders'],['disp','Dispatch']];
  $('#n').innerHTML=t.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';draw()">${l}</button>`).join('');
  const f={new:vNew,mine:()=>vOrders(false),orders:()=>vOrders(true),products:vProds,disp:vDisp,staff:vStaff,backup:vBackup}[tab];$('#m').innerHTML=f()}
// ---- new order
const total=()=>prods.reduce((a,p)=>a+(cart[p.id]||0)*p.rate,0),count=()=>Object.keys(cart).length;
const barTxt=()=>count()+' items · '+rs(total());
function vNew(){
  const rows=prods.map(p=>`<div class="c r pr" data-n="${esc(p.name.toLowerCase())}" style="${pq&&!p.name.toLowerCase().includes(pq)?'display:none':''}"><div><b>${esc(p.name)}</b><br><small class="mu">${rs(p.rate)} / ${esc(p.unit)} · <span class="${p.stock<=5?'low':''}">${p.stock} in stock</span></small></div><div class="sp"><button class="st" onclick="stepQ('${p.id}',-1)">−</button><input id="q_${p.id}" type="number" min="0" inputmode="decimal" placeholder="0" value="${cart[p.id]||''}" onchange="setQ('${p.id}',this.value)"><button class="st" onclick="stepQ('${p.id}',1)">+</button></div></div>`).join('');
  return (editId?`<div class="c r"><b>Editing order</b><button class="s" onclick="cancelEdit()">Stop editing</button></div>`:'')+
  `<div class="c g"><input placeholder="Shop / customer name" value="${esc(shop)}" oninput="shop=this.value"><input placeholder="🔍 Search product" value="${esc(pq)}" oninput="filt(this.value)"></div>`+
  (rows||'<p class="mu">No products yet.</p>')+
  (isAdmin?'':`<details class="c"><summary>＋ Add a new product</summary><div class="g" style="margin-top:8px"><input id="pn" placeholder="Product name"><input id="pu" placeholder="Unit (kg, bag, litre)"><input id="pr" type="number" inputmode="decimal" placeholder="Rate"><button onclick="addP()">Save product</button><small class="mu">The admin adds the stock.</small></div></details>`)+
  `<div id="bar" class="r"><b id="tot">${barTxt()}</b><button onclick="place()">${editId?'Save changes':'Submit order'}</button></div>`}
function stepQ(id,d){const i=$('#q_'+id),v=Math.max(0,(+i.value||0)+d);i.value=v||'';setQ(id,v)}
function filt(v){pq=v.toLowerCase().trim();document.querySelectorAll('.pr').forEach(e=>e.style.display=(!pq||e.dataset.n.includes(pq))?'':'none')}
function setQ(id,v){v=+v;const p=prods.find(x=>x.id===id);if(v>0){if(p&&v>p.stock){alert('Only '+p.stock+' '+p.unit+' in stock');delete cart[id];return draw()}cart[id]=v}else delete cart[id];$('#tot').textContent=barTxt()}
async function place(){if(!shop.trim())return alert('Enter shop name');
  const items=prods.filter(p=>cart[p.id]>0).map(p=>({pid:p.id,name:p.name,unit:p.unit,rate:p.rate,qty:cart[p.id]}));if(!items.length)return alert('Add quantities for at least one product');
  const d={shop:shop.trim(),items,total:items.reduce((a,i)=>a+i.rate*i.qty,0)};
  try{if(editId)await db.doc('orders/'+editId).update(d);else await db.collection('orders').add({...d,status:'pending',uid:me.uid,sname:me.dn,at:Date.now()});
    cart={};shop='';pq='';editId=null;tab=isAdmin?'orders':'mine';draw()}catch(e){er(e)}}
function editO(id){const o=orders.find(x=>x.id===id);if(!o)return;cart={};o.items.forEach(i=>cart[i.pid]=i.qty);shop=o.shop;editId=id;tab='new';draw()}
function cancelEdit(){cart={};shop='';editId=null;draw()}
// ---- orders
function needBackup(){try{const t=+localStorage.getItem('lb');return !t||Date.now()-t>6048e5}catch(e){return false}}
function vOrders(all){let h=(isAdmin&&needBackup())?`<div class="c" style="border-color:var(--er)"><b class="low">⚠ No backup in the last 7 days</b><br><small>Open the Backup tab and download the Excel file.</small></div>`:'';
  if(!orders.length)return h+'<p class="mu">No orders yet.</p>';
  return h+orders.map(o=>{const pend=o.status==='pending';return `<div class="c"><div class="r"><b>${esc(o.shop)}</b><span><span class="b ${o.status}">${o.status}</span>${disp.some(x=>x.oid===o.id)?' <span class="b confirmed">dispatched</span>':''}</span></div>
  <small class="mu">${new Date(o.at).toLocaleString()} · ${esc(o.sname)}</small>
  <div style="margin:8px 0">${o.items.map(i=>`${esc(i.name)} — ${i.qty} ${esc(i.unit)} × ${rs(i.rate)}`).join('<br>')}</div>
  <div class="r"><b>${rs(o.total)}</b></div><div class="w">${pend?`<button class="s" onclick="editO('${o.id}')">Edit</button>`:''}${(pend||isAdmin)?`<button class="d" onclick="delO('${o.id}')">Delete</button>`:''}${isAdmin&&pend?`<button onclick="conf('${o.id}')">Confirm</button><button class="d" onclick="cancelO('${o.id}')">Cancel order</button>`:''}</div></div>`}).join('')}
async function conf(id){try{await db.runTransaction(async t=>{const or=db.doc('orders/'+id),o=await t.get(or);if(o.data().status!=='pending')return;
  const ps=await Promise.all(o.data().items.map(i=>t.get(db.doc('products/'+i.pid))));
  o.data().items.forEach((i,k)=>{if(!ps[k].exists||ps[k].data().stock<i.qty)throw Error('Not enough stock: '+i.name)});
  o.data().items.forEach((i,k)=>t.update(ps[k].ref,{stock:ps[k].data().stock-i.qty}));t.update(or,{status:'confirmed'})})}catch(e){alert(e.message)}}
async function cancelO(id){if(confirm('Cancel this order?'))db.doc('orders/'+id).update({status:'cancelled'}).catch(er)}
function delO(id){const o=orders.find(x=>x.id===id);if(!o)return;
  if(o.status==='confirmed'){if(!confirm('Delete this confirmed order? The stock will be returned.'))return;
    return askPw(async()=>{try{await db.runTransaction(async t=>{const or=db.doc('orders/'+id);const ps=await Promise.all(o.items.map(i=>t.get(db.doc('products/'+i.pid))));
      o.items.forEach((i,k)=>{if(ps[k].exists)t.update(ps[k].ref,{stock:ps[k].data().stock+i.qty})});t.delete(or)})}catch(e){er(e)}})}
  if(confirm('Delete this order?'))db.doc('orders/'+id).delete().catch(er)}
function askPw(cb,onCancel){const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
  w.innerHTML='<div class="c g" style="width:100%;max-width:340px"><b>Enter admin password to confirm this change</b><input id="apw" type="password" placeholder="Admin password"><div class="r"><button class="s" id="apc">Cancel</button><button id="apo">Confirm</button></div><small class="low" id="ape"></small></div>';
  document.body.appendChild(w);const close=()=>{w.remove();if(onCancel)onCancel()};$('#apc').onclick=close;
  setTimeout(()=>$('#apw')&&$('#apw').focus(),50);
  $('#apw').onkeydown=e=>{if(e.key==='Enter')$('#apo').click()};
  $('#apo').onclick=async()=>{try{await auth.currentUser.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(me.email,$('#apw').value));w.remove();cb()}catch(e){$('#ape').textContent='Wrong password'}}}
// ---- products
function vProds(){return `<div class="c g"><b>Import from Excel</b><small class="mu">Columns: Product, Unit, Rate, Stock. Existing products are updated by name; new ones are added.</small><input id="xf" type="file" accept=".xlsx,.xls,.csv"><div class="g2"><button class="s" onclick="tmpl()">Get template</button><button onclick="importX()">Import</button></div></div>
  <div class="c g"><b>Add product</b><input id="pn" placeholder="Product name"><div class="g2"><input id="pu" placeholder="Unit (kg, bag)"><input id="pr" type="number" inputmode="decimal" placeholder="Rate"></div><input id="ps" type="number" inputmode="decimal" placeholder="Opening stock"><button onclick="addP()">Save product</button></div>`+
  prods.map(p=>`<div class="c g"><div class="r" style="align-items:end"><label style="flex:1">Name<input value="${esc(p.name)}" onchange="upT('${p.id}','name',this.value,this)"></label><button class="d sm" onclick="delP('${p.id}')">Delete</button></div>
  <div class="g2"><label>Unit<input value="${esc(p.unit)}" onchange="upT('${p.id}','unit',this.value,this)"></label><label>Rate<input type="number" value="${p.rate}" onchange="upP('${p.id}','rate',this.value,this)"></label></div>
  <div class="g2"><label>Stock ${p.stock<=5?'<span class="low">(low)</span>':''}<input id="st_${p.id}" type="number" value="${p.stock}"></label><button style="align-self:end" onclick="setStock('${p.id}')">Update stock</button></div></div>`).join('')}
function importX(){const f=$('#xf').files[0];if(!f)return alert('Choose an Excel file first');
  const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    const get=(o,k)=>{const x=Object.keys(o).find(y=>y.trim().toLowerCase()===k);return x===undefined?undefined:o[x]};
    const list=rows.map(o=>({n:String(get(o,'product')??get(o,'name')??'').trim(),u:get(o,'unit'),r:get(o,'rate'),s:get(o,'stock')})).filter(x=>x.n);
    if(!list.length)return alert('No products found. Check the column names.');
    if(!confirm('Import '+list.length+' products?'))return;
    askPw(async()=>{let up=0,nw=0;try{for(const x of list){const p=prods.find(y=>y.name.toLowerCase()===x.n.toLowerCase()),d={};
      if(x.u!==undefined&&String(x.u).trim())d.unit=String(x.u).trim();if(x.r!==undefined&&x.r!=='')d.rate=Math.max(0,+x.r||0);if(x.s!==undefined&&x.s!=='')d.stock=Math.max(0,+x.s||0);
      if(p){await db.doc('products/'+p.id).update(d);up++}else{await db.collection('products').add({name:x.n,unit:d.unit||'pcs',rate:d.rate||0,stock:d.stock||0});nw++}}
      alert('Done: '+up+' updated, '+nw+' new')}catch(e){er(e)}})}catch(e){er(e)}};r.readAsArrayBuffer(f)}
function tmpl(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Product','Unit','Rate','Stock'],['Cattle feed','bag (50kg)',2400,40],['Rice','kg',95,500]]),'Products');XLSX.writeFile(wb,'products-template.xlsx')}
function addP(){const n=$('#pn').value.trim(),u=$('#pu').value.trim(),se=$('#ps');if(!n||!u)return alert('Name and unit required');
  db.collection('products').add({name:n,unit:u,rate:+$('#pr').value||0,stock:se?(+se.value||0):0}).then(()=>alert('Product saved')).catch(er)}
function upP(id,f,v,el){const old=prods.find(x=>x.id===id)[f],nv=Math.max(0,+v||0);if(nv===old)return;
  askPw(()=>db.doc('products/'+id).update({[f]:nv}).catch(er),()=>{if(el)el.value=old})}
function upT(id,f,v,el){const old=prods.find(x=>x.id===id)[f];v=v.trim();if(!v||v===old)return(el&&(el.value=old));
  askPw(()=>db.doc('products/'+id).update({[f]:v}).catch(er),()=>{if(el)el.value=old})}
function setStock(id){const el=$('#st_'+id),old=prods.find(x=>x.id===id).stock,v=Math.max(0,+el.value||0);if(v===old)return;askPw(()=>db.doc('products/'+id).update({stock:v}).then(()=>alert('Stock updated')).catch(er),()=>el.value=old)}
function delP(id){if(confirm('Delete this product?'))askPw(()=>db.doc('products/'+id).delete().catch(er))}
// ---- salesmen
function vStaff(){return `<div class="c g"><b>Add salesman</b><input id="sn" placeholder="Full name"><input id="su" placeholder="Username (e.g. ram)" autocapitalize="none"><input id="sw" placeholder="Password (min 6 characters)"><button onclick="addS()">Create account</button></div>`+
  staff.map(s=>`<div class="c r"><div><b>${esc(s.name)}</b><br><small class="mu">Username: ${esc(s.id)}<br>Password: ${esc(s.pass)}</small></div><button class="d" onclick="delS('${s.id}')">Remove</button></div>`).join('')}
function delS(id){if(confirm('Remove this salesman? They will no longer be able to use the app.'))db.doc('staff/'+id).delete().catch(er)}
async function addS(){const n=$('#sn').value.trim(),u=$('#su').value.trim().toLowerCase().replace(/[^a-z0-9._]/g,''),p=$('#sw').value;
  if(!n||!u||p.length<6)return alert('Fill all fields; password min 6');
  let app2;try{await db.doc('staff/'+u).set({name:n,pass:p});
    app2=firebase.initializeApp(cfg,'s'+Date.now());await app2.auth().createUserWithEmailAndPassword(u+DOM,p);alert('Salesman created: '+u)}
  catch(e){await db.doc('staff/'+u).delete().catch(()=>{});alert(e.message)}finally{if(app2)app2.delete()}}
// ---- dispatch (bill scanner)
function shrink(file,max,q){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=u})}
async function pickD(el){const f=el.files[0];if(!f)return;
  try{let q=.6,full=await shrink(f,1400,q);while(full.length>800000&&q>.3){q-=.1;full=await shrink(f,1400,q)}
    dThumb=await shrink(f,160,.5);dImg=full;
    if(window.BarcodeDetector&&!dBill){try{const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r[0])dBill=r[0].rawValue}catch(e){}}
    draw()}catch(e){alert('Could not read the photo. Try again.')}}
function vDisp(){
  const opts=orders.filter(o=>o.status!=='cancelled').map(o=>`<option value="${o.id}" ${dOrder===o.id?'selected':''}>${esc(o.shop)} · ${rs(o.total)} · ${new Date(o.at).toLocaleDateString()}</option>`).join('');
  const list=disp.length?disp.map(x=>`<div class="c r"><div style="display:flex;gap:12px;align-items:center;min-width:0"><img src="${x.thumb}" onclick="viewD('${x.id}')" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)"><div style="min-width:0"><b>${esc(x.bill||'No bill number')}</b><br><small class="mu">${esc(x.shop||'No order linked')}<br>${new Date(x.at).toLocaleString()} · ${esc(x.by)}</small>${x.note?`<br><small>${esc(x.note)}</small>`:''}</div></div>${isAdmin?`<button class="d sm" onclick="delD('${x.id}')">Delete</button>`:''}</div>`).join(''):'<p class="mu">No dispatched bills yet.</p>';
  return `<div class="c g"><b>Scan dispatched bill</b>
  <input id="df" type="file" accept="image/*" capture="environment" style="display:none" onchange="pickD(this)">
  <button onclick="document.getElementById('df').click()">📷 Scan bill with camera</button>
  ${dImg?`<img src="${dImg}" style="width:100%;border-radius:12px;border:1px solid var(--bd)">`:''}
  <select onchange="dOrder=this.value"><option value="">Link to an order (optional)</option>${opts}</select>
  <input placeholder="Bill number" value="${esc(dBill)}" oninput="dBill=this.value">
  <input placeholder="Note (vehicle, driver, etc.)" value="${esc(dNote)}" oninput="dNote=this.value">
  <button onclick="saveD()" ${dImg?'':'disabled style="opacity:.5"'}>Save dispatch record</button></div>`+list}
async function saveD(){if(!dImg)return alert('Scan the bill first');const o=orders.find(x=>x.id===dOrder),id='d'+Date.now()+Math.random().toString(36).slice(2,5);
  try{await db.doc('dispimg/'+id).set({img:dImg,uid:me.uid});
    await db.doc('dispatches/'+id).set({thumb:dThumb,bill:dBill.trim(),note:dNote.trim(),oid:dOrder||'',shop:o?o.shop:'',uid:me.uid,by:me.dn,at:Date.now()});
    dImg=dThumb=dBill=dNote=dOrder='';alert('Bill saved');draw()}catch(e){er(e)}}
async function viewD(id){try{const d=await db.doc('dispimg/'+id).get();if(!d.exists)return alert('Image not found');
  const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;background:#000d;z-index:99;display:flex;flex-direction:column;padding:12px';
  w.innerHTML='<button class="s" style="align-self:flex-end">Close</button><div style="flex:1;overflow:auto;margin-top:8px"><img style="width:100%" src="'+d.data().img+'"></div>';
  w.querySelector('button').onclick=()=>w.remove();document.body.appendChild(w)}catch(e){er(e)}}
function delD(id){if(confirm('Delete this dispatch record?'))db.doc('dispatches/'+id).delete().then(()=>db.doc('dispimg/'+id).delete()).catch(er)}
// ---- backup
function vBackup(){let lb='never';try{const t=+localStorage.getItem('lb');if(t)lb=new Date(t).toLocaleString()}catch(e){}
  return `<div class="c g"><b>Backup to Excel</b><p class="mu">One Excel file with 4 sheets: <b>Stock</b>, <b>Orders</b> (one row per item), <b>Salesmen</b> and <b>Dispatch</b> (bill photos are not included). Download it every week and save it to Google Drive.</p><small>Last backup on this phone: ${lb}</small><button onclick="backup()">Download Excel backup</button></div>`}
async function backup(){try{const g=async c=>(await db.collection(c).get()).docs.map(d=>({id:d.id,...d.data()}));
  const [P,O,S,D]=await Promise.all(['products','orders','staff','dispatches'].map(g));const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(P.map(p=>({Product:p.name,Unit:p.unit,Rate:p.rate,Stock:p.stock}))),'Stock');
  const rows=[];O.sort((a,b)=>a.at-b.at).forEach(o=>o.items.forEach(i=>rows.push({Date:new Date(o.at).toLocaleString(),Shop:o.shop,Salesman:o.sname,Product:i.name,Unit:i.unit,Qty:i.qty,Rate:i.rate,Amount:i.qty*i.rate,'Order total':o.total,Status:o.status})));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Orders');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.map(x=>({Name:x.name,Username:x.id}))),'Salesmen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.sort((a,b)=>a.at-b.at).map(x=>({Date:new Date(x.at).toLocaleString(),'Bill number':x.bill,Shop:x.shop,Note:x.note,'Added by':x.by}))),'Dispatch');
  XLSX.writeFile(wb,'backup-'+new Date().toISOString().slice(0,10)+'.xlsx');
  try{localStorage.setItem('lb',Date.now())}catch(e){}draw()}catch(e){er(e)}}
</script></body></html>
