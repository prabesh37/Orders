<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estimate to VAT Bill</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1c2430;--mu:#667085;--bd:#d5dbe3;--ac:#0f6b4f;--on:#fff;--wa:#b54708;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#1d232a;--tx:#e8ecf1;--mu:#98a2b3;--bd:#33404c;--ac:#4cc79a;--on:#0b1f17;--wa:#fdb022}}
:root[data-theme="dark"]{--bg:#14181d;--card:#1d232a;--tx:#e8ecf1;--mu:#98a2b3;--bd:#33404c;--ac:#4cc79a;--on:#0b1f17;--wa:#fdb022}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;text-align:center}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn:disabled{opacity:.5}
input[type=file]{display:none}
#thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#thumbs img{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd)}
#msg{font-size:13px;color:var(--mu);margin-top:8px}
#msg.err{color:var(--wa)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;color:var(--mu);min-width:70px}
input[type=text]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
th{text-align:left;font-size:12px;color:var(--mu);padding:4px;border-bottom:1px solid var(--bd)}
td{padding:3px;border-bottom:1px solid var(--bd)}
td input{width:100%;padding:5px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--tx);font:inherit}
td input:focus{border-color:var(--bd);background:var(--bg)}
.r{text-align:right}
.tot{margin:10px 0 0 auto;width:270px;max-width:100%}
.tot div{display:flex;justify-content:space-between;padding:2px 0}
.tot .net{border-top:2px solid var(--tx);border-bottom:2px solid var(--tx);font-weight:700;margin-top:3px;padding:4px 0}
.chk{font-size:13px;margin-top:8px}
.ok{color:var(--ac)}.bad{color:var(--wa)}
[hidden]{display:none!important}
</style></head><body>
<h1>Estimate to VAT Bill</h1>
<p class="sub">Attach the estimate bill photo to look at, type the items, and get the VAT bill PDF. Rates are divided by 1.13 and 13% VAT is added.</p>

<div class="card">
  <label class="btn" for="file">📷 Attach estimate bill</label>
  <input id="file" type="file" accept="image/*" multiple>
  <div id="thumbs"></div>
  <div id="msg"></div>
</div>

<div id="out">
  <div class="card">
    <div class="row"><label>Ref No.</label><input type="text" id="ref"></div>
    <div class="row"><label>Date</label><input type="text" id="date"></div>
    <div class="row"><label>Bill to</label><input type="text" id="party"></div>
    <div class="row"><label>Discount %</label><input type="text" id="disc" inputmode="decimal"></div>
  </div>
  <div class="card">
    <div class="scroll"><table id="tb"></table></div>
    <button class="btn" id="add" style="margin-top:8px">+ Add item</button>
    <div class="tot" id="tot"></div>
    <div class="chk" id="chk"></div>
  </div>
  <button class="btn p" id="pdf">⬇ Download PDF</button>
</div>

<script>
const $=s=>document.querySelector(s);
const S={ref:'',date:'',issuer:'C.S.E Surunga',party:'Kinmel Supermarket Pvt. Ltd. (Birtamode)',disc:2,items:[{n:'',q:'',u:'Pcs',r:''}]};
let files=[],sample=null,printed=0;
const V=1.13,VP=13;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=p=>(p/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const ones="Zero One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen".split(" ");
const tens=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
function b1k(x){const o=[];if(x>=100){o.push(ones[Math.floor(x/100)]+" Hundred");x%=100}if(x>=20){o.push(tens[Math.floor(x/10)]+(x%10?" "+ones[x%10]:""))}else if(x>0)o.push(ones[x]);return o.join(" ")}
function words(n){if(n===0)return"Zero";const o=[];if(n>=100000){o.push(b1k(Math.floor(n/100000))+" Lakh");n%=100000}if(n>=1000){o.push(b1k(Math.floor(n/1000))+" Thousand");n%=1000}if(n>0)o.push(b1k(n));return o.join(" ")}
const say=(t,e)=>{const m=$('#msg');m.textContent=t;m.className=e?'err':''};

$('#file').onchange=e=>{
  files=[...e.target.files];$('#thumbs').innerHTML='';
  files.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);$('#thumbs').append(i)});
};
function renderTable(){
  $('#tb').innerHTML='<tr><th>SN</th><th>Description</th><th>Qty</th><th>Unit</th><th class="r">Old rate</th><th class="r">New rate</th><th class="r">Amount</th><th></th></tr>'+
  S.items.map((it,i)=>`<tr><td>${i+1}</td><td><input data-i="${i}" data-f="n" value="${esc(it.n)}"></td><td style="width:60px"><input data-i="${i}" data-f="q" value="${esc(it.q)}" inputmode="decimal"></td><td style="width:54px"><input data-i="${i}" data-f="u" value="${esc(it.u)}"></td><td style="width:78px"><input class="r" data-i="${i}" data-f="r" value="${esc(it.r)}" inputmode="decimal"></td><td class="r" id="nr${i}"></td><td class="r" id="am${i}"></td><td><button data-del="${i}" style="border:0;background:none;color:var(--mu);font-size:18px">×</button></td></tr>`).join('');
}
function calc(){
  let tot=0,old=0;const rows=[];
  S.items.forEach((it,i)=>{const q=parseFloat(it.q),r=parseFloat(it.r);
    if(!(q>0)||!(r>0)){rows.push(null);return}
    const rp=Math.round(r*100/V),ap=Math.round(rp*q);tot+=ap;old+=Math.round(r*100*q);rows.push({it,q,rp,ap})});
  const dp=parseFloat(S.disc)||0,disc=Math.round(tot*dp/100),tx=tot-disc,vat=Math.round(tx*VP/100),net=tx+vat;
  return{rows,tot,old,dp,disc,tx,vat,net};
}
function render(){
  const c=calc();
  c.rows.forEach((r,i)=>{const a=$('#nr'+i),b=$('#am'+i);if(a){a.textContent=r?money(r.rp):'';b.textContent=r?money(r.ap):''}});
  $('#tot').innerHTML=`<div><span>Total</span><span>${money(c.tot)}</span></div><div><span>Less: Discount ${c.dp.toFixed(2)}%</span><span>${money(c.disc)}</span></div><div><span>Taxable amount</span><span>${money(c.tx)}</span></div><div><span>VAT 13%</span><span>${money(c.vat)}</span></div><div class="net"><span>NET AMOUNT</span><span>${money(c.net)}</span></div>`;
  const oldR=c.old/100;
  $('#chk').innerHTML=printed?(Math.abs(oldR-printed)<1?`<span class="ok">✓ Old rates × qty = ${oldR.toLocaleString('en-US')}, matches the printed total.</span>`:`<span class="bad">⚠ Old rates × qty = ${oldR.toLocaleString('en-US')} but the bill total is ${printed.toLocaleString('en-US')}. Check qty and rates.</span>`):`Old rates × qty = ${oldR.toLocaleString('en-US')}`;
}
$('#tb').addEventListener('click',e=>{const d=e.target.dataset.del;if(d==null)return;S.items.splice(+d,1);if(!S.items.length)S.items.push({n:'',q:'',u:'Pcs',r:''});renderTable();render()});
$('#add').onclick=()=>{S.items.push({n:'',q:'',u:'Pcs',r:''});renderTable();render()};
$('#tb').addEventListener('input',e=>{const t=e.target;if(t.dataset.i==null)return;S.items[t.dataset.i][t.dataset.f]=t.value;render()});
[['ref','ref'],['date','date'],['party','party'],['disc','disc']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{S[k]=e.target.value;render()}));

$('#pdf').onclick=async()=>{
  const c=calc(),{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),L=15,R=195;let y;
  const colhead=()=>{d.setLineWidth(.4);d.line(L,y,R,y);d.setFont('helvetica','bold');d.setFontSize(9);d.text('SN',L+1,y+5);d.text('DESCRIPTION',L+12,y+5);d.text('QUANTITY',R-62,y+5,{align:'right'});d.text('RATE',R-32,y+5,{align:'right'});d.text('AMOUNT',R-1,y+5,{align:'right'});d.line(L,y+7,R,y+7);y+=7};
  d.setFont('helvetica','bold');d.setFontSize(15);d.text('INVOICE CONFIRMATION RECEIPT',105,18,{align:'center'});
  d.setFont('helvetica','normal');d.setFontSize(9);d.text(S.issuer||'',105,24,{align:'center'});
  d.setFont('helvetica','bold');d.setFontSize(10);d.text('REF. No: '+(S.ref||''),L,33);d.text('DATE: '+(S.date||''),R,33,{align:'right'});d.text('REF. To: '+(S.party||''),L,39);
  y=44;colhead();
  let n=0;
  c.rows.forEach(r=>{if(!r)return;n++;
    if(y>268){d.addPage();y=15;colhead()}
    y+=6.5;d.setFont('helvetica','normal');d.setFontSize(9.5);
    d.text(String(n),L+1,y);d.text(String(r.it.n).slice(0,48),L+12,y);d.text(r.q+' '+r.it.u,R-62,y,{align:'right'});d.text(money(r.rp),R-32,y,{align:'right'});d.text(money(r.ap),R-1,y,{align:'right'});
  });
  y+=3;d.line(L,y,R,y);
  if(y>225){d.addPage();y=15}
  const line=(a,b,bold)=>{y+=6;d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(bold?11:10);d.text(a,R-70,y);d.text(b,R-1,y,{align:'right'})};
  line('TOTAL',money(c.tot));line('Less: Discount '+c.dp.toFixed(2)+'%',money(c.disc));line('Taxable Amount',money(c.tx));line('VAT 13.00%',money(c.vat));
  y+=2;d.line(R-72,y,R,y);line('NET AMOUNT',money(c.net),1);y+=2;d.line(R-72,y,R,y);
  y+=10;d.setFont('helvetica','italic');d.setFontSize(9.5);
  d.text('In words: Rs. '+words(Math.floor(c.net/100))+(c.net%100?' and '+words(c.net%100)+' Paisa':'')+' Only.',L,y);
  y+=28;d.setLineWidth(.3);d.line(L,y,L+45,y);d.line(R-45,y,R,y);d.setFont('helvetica','bold');d.setFontSize(9);d.text('RECEIVED BY',L,y+5);d.text('CHECKED BY',R,y+5,{align:'right'});
  const a=document.createElement('a');a.href=URL.createObjectURL(d.output('blob'));
  a.download='VAT_Bill_'+((S.ref||'bill').replace(/[^\w-]/g,''))+'.pdf';document.body.append(a);a.click();a.remove();
};
renderTable();render();
['ref','date','party','disc'].forEach(k=>$('#'+k).value=S[k]);
</script></body></html>
